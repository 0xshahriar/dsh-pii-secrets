# GitHub Actions: run the test suite on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm test

  lint-markdown:
    name: verify no secrets in markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The docs must never contain a real credential. This greps for the
      # shapes the plugin itself detects and fails if one appears in prose.
      # AWS's own documented example keys are allowlisted by exact string.
      - name: Scan docs for credential-shaped strings
        run: |
          set -euo pipefail
          pattern='(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|sk-[A-Za-z0-9_-]{20,}|xox[abprs]-[A-Za-z0-9-]{10,})'
          # Documented fake values only — never a real credential.
          allowlist='AKIAIOSFODNN7EXAMPLE'
          found=$(grep -rEn "$pattern" --include='*.md' . || true)
          hits=$(printf '%s\n' "$found" | grep -vF "$allowlist" | grep -v '^$' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::A credential-shaped string was found in the documentation."
            exit 1
          fi
          echo "No credential-shaped strings found in markdown."
